name: Keystore Olustur
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-22.04
    steps:
    - name: Java kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Keystore olustur
      run: |
        keytool -genkey -v -keystore minikkasifler.keystore \
          -alias minikkasifler \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass minik12345 -keypass minik12345 \
          -dname "CN=Minik Kasifler, OU=Oyun, O=Kisisel, L=Istanbul, S=Istanbul, C=TR"
    - name: Keystore dosyasini kaydet
      uses: actions/upload-artifact@v4
      with:
        name: minikkasifler-keystore
        path: minikkasifler.keystore

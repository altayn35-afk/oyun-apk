name: Test APK

on:
  push:
    branches: [reklam-test-1-4]
    paths:
      - '.github/workflows/test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install --user --upgrade buildozer cython==0.29.36

      - name: Build test APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer --profile tani -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minik-Kasifler-Test-APK
          path: bin/*.apk
          if-no-files-found: error

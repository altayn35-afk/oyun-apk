name: Build Android App

on:
  push:
    branches: [ main, master, ana, reklam-test-1-4 ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --upgrade pip
        pip3 install --user --upgrade buildozer cython==0.29.36

    - name: Build with Buildozer
      run: |
        export PATH=$HOME/.local/bin:$PATH
        buildozer -v android release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: oyun-paketleri
        path: |
          bin/*.aab
          bin/*.apk

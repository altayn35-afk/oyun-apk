name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git python3-pip openjdk-17-jdk unzip zlib1g-dev libffi-dev libssl-dev libncurses-dev
    - name: Install buildozer
      run: pip install buildozer
    - name: Build APK
      run: |
        # Buildozer'ı bir kez çalıştırıp klasörleri oluşturmasını sağla (hata verecek ama klasörü açacak)
        buildozer android debug || true
        
        # Şimdi lisansları Buildozer'ın kendi oluşturduğu SDK klasörüne zorla kabul ettir
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5261c55" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # Şimdi gerçek derlemeyi başlat
        buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

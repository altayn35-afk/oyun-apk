name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3-pip openjdk-17-jdk unzip
        pip install --upgrade pip
        pip install buildozer
    - name: Build APK
      run: |
        # Buildozer'ın kendi SDK'yı kurmaya çalışmasını engelliyoruz
        # Bunun yerine buildozer'a SDK yerini biz manuel gösteriyoruz
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
        buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

name: APK Derle
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Sistem paketlerini kur
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
    - name: Buildozer kur
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33
    - name: Pip sürümünü sabitle
      run: |
        echo "pip<26" > /tmp/pip-constraint.txt
        echo "PIP_CONSTRAINT=/tmp/pip-constraint.txt" >> $GITHUB_ENV
    - name: APK derle (lisanslari otomatik kabul et)
      run: |
        yes | buildozer -v android debug
    - name: APK dosyasini kaydet
      uses: actions/upload-artifact@v4
      with:
        name: minik-kasifler-apk
        path: bin/*.apk

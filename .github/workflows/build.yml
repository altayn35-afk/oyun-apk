
name: Build Android App

on:
  push:
        branches: [reklam-test-1-4, can-ve-balon-guncellemesi, 16kb-uyumluluk-duzeltmesi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade "pip==24.0"
          python -m pip install --user --upgrade buildozer cython==0.29.36

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret bulunamadi."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS"

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          buildozer -v android release

          AAB_FILE=$(find bin -maxdepth 1 -name '*.aab' -type f | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "::error::AAB dosyasi olusturulamadi."
            exit 1
          fi

          jarsigner \
            -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            "$AAB_FILE" "$KEY_ALIAS"

          jarsigner -verify -verbose -certs "$AAB_FILE"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oyun-paketleri
          path: bin/*.aab
          if-no-files-found: error

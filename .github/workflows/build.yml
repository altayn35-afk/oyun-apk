name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: |
          git config --global --add safe.directory /__w/oyun-apk/oyun-apk

      - name: Build APK
        run: |
          echo "y" | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
